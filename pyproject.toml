[project]
name = "corax"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["hgnn-job", "scripts", "ai-corax"]
# Noise from third-party libraries on Python 3.13, not from Corax code.
filterwarnings = [
    "ignore::DeprecationWarning:torch_geometric.*",
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
