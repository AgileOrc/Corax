# Envoy in front of the campus API. Every request goes to OPA first (ext_authz, gRPC); if OPA cannot be
# reached the request is denied (failure_mode_allow: false). /corax/* is Corax's admin API (service),
# everything else is the application (upstream). The access log shows OPA's reason and the AI risk.
static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: {address: 0.0.0.0, port_value: 8080}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "%REQ(:METHOD)% %REQ(:PATH)% -> %RESPONSE_CODE% reason=%DYNAMIC_METADATA(envoy.filters.http.ext_authz:corax_reason)% risk=%DYNAMIC_METADATA(envoy.filters.http.ext_authz:corax_risk)%\n"
                route_config:
                  virtual_hosts:
                    - name: campus
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/corax/"}
                          route: {cluster: service}
                        - match: {prefix: "/"}
                          route: {cluster: upstream}
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      grpc_service:
                        envoy_grpc: {cluster_name: opa}
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: opa
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opa
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: opa, port_value: 9191}

    - name: service
      type: STRICT_DNS
      load_assignment:
        cluster_name: service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: service, port_value: 8000}

    - name: upstream
      type: STRICT_DNS
      load_assignment:
        cluster_name: upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: upstream, port_value: 5678}
